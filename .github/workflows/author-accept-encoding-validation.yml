name: Author validation - Accept-Encoding tokens

on:
  push:
    branches: [validation/accept-encoding-ab]

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  SOURCE_HEAD: a2ff127082faa2bebb7c555151d3dc48d8d1454c
  SOURCE_BASE: fe0c30ad7f2dafba84c7c0fd7582df6cf0f8d81d

jobs:
  head:
    strategy:
      fail-fast: false
      matrix:
        go: [1.26.x, 1.27.x]
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: a2ff127082faa2bebb7c555151d3dc48d8d1454c
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - run: go version
      - name: Full shuffled suite
        shell: bash
        run: go test -json -shuffle=on ./... | tee head.jsonl
      - name: Full shuffled race suite
        if: always()
        shell: bash
        run: go test -json -race -shuffle=on ./... | tee race.jsonl
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: head-${{ matrix.os }}-${{ matrix.go }}
          path: '*.jsonl'

  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fe0c30ad7f2dafba84c7c0fd7582df6cf0f8d81d
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.x
      - run: go version
      - name: Clean upstream suite
        run: go test -json -shuffle=on ./... | tee base.jsonl
      - name: Clean upstream race suite
        if: always()
        run: go test -json -race -shuffle=on ./... | tee base-race.jsonl
      - name: New tests must fail on unmodified production code
        if: always()
        run: |
          git restore --source="$SOURCE_HEAD" --worktree -- accept_encoding_test.go
          git diff --exit-code -- '*.go' ':!accept_encoding_test.go'
          set +e
          go test -json -run 'Test(RequestHeaderHasAcceptEncodingTokens|CompressHandlerAcceptEncodingTokens)$' -count=1 . > negative.jsonl 2>&1
          result=$?
          set -e
          test "$result" -eq 1
          grep -q 'Content-Encoding = ' negative.jsonl
          grep -q 'want gzip' negative.jsonl
          if grep -q 'build failed' negative.jsonl; then exit 1; fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: baseline-and-negative-control
          path: '*.jsonl'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: a2ff127082faa2bebb7c555151d3dc48d8d1454c
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.x
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.14.0
          args: --verbose
